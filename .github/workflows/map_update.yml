name: Updating the map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'common_samples/common_samples.tsv'
      - 'scripts/map.py'
      - '.github/workflows/map_update.yml'

jobs:
  update_map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cartopy and Shapely wheels ship their own GEOS. Installing libgeos
      # from apt loads a second copy and segfaults on current Ubuntu runners.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2" "matplotlib>=3.8" "cartopy>=0.23" "shapely>=2" "pyproj"

      - name: Run map visualization script
        env:
          MPLBACKEND: Agg
        run: python scripts/map.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote set-url origin https://${{secrets.MAP_METAGENOME}}@github.com/agni-bioinformatics-lab/OilMetagenomesDB.git
          git add README.md assets/image/git_img_map.png
          if git diff --cached --quiet; then
            echo "Map is already up to date"
          else
            git commit -m "Update map visualization"
            git push
          fi
